function renderPages(){const query=(document.getElementById('pageFilter')?.value||'').toLocaleLowerCase();const filtered=pages.filter(r=>t(r[0],r[1]).toLocaleLowerCase().includes(query));document.getElementById('pageTable').innerHTML=filtered.length?table([t('Page / product','Page / produit'),t('Clicks','Clics'),'Impressions',t('CTR shown','Taux affiché')],filtered.map(r=>[esc(t(r[0],r[1])),r[2],esc(r[3]),r[4]===null?'—':pct(r[4])]),'numeric'):`<p class="empty">${t('No matching pages.','Aucune page correspondante.')}</p>`;document.getElementById('rowCount').textContent=t(`${filtered.length} of 27 pages · Online-store reporting · “<20” means suppressed low volume`,`${filtered.length} pages sur 27 · Rapport boutique en ligne · « <20 » indique un faible volume masqué`)}
let observer;
function observeSections(){observer?.disconnect();observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('#nav a').forEach(a=>{const active=a.hash==='#'+e.target.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}},{rootMargin:'-130px 0px -65% 0px',threshold:0});document.querySelectorAll('main section').forEach(s=>observer.observe(s))}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang===lang)return;const sections=[...document.querySelectorAll('main section')];const current=sections.find(s=>s.getBoundingClientRect().bottom>140)||sections[0];const offset=current.getBoundingClientRect().top;const id=current.id;const query=document.getElementById('pageFilter').value;lang=b.dataset.lang;try{localStorage.setItem('boise-language',lang)}catch{}const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);render();document.getElementById('pageFilter').value=query;renderPages();window.scrollBy({top:document.getElementById(id).getBoundingClientRect().top-offset,behavior:'instant'});document.getElementById('languageStatus').textContent=t('Report displayed in English.','Bilan affiché en français.')}));
render();
